<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b110d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)">
<title>RemoteType 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b110d'/%3E%3Cpath d='M8 20v4M16 10v14M24 14v10' stroke='%2353e08c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark light;
    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace;
    --sans: -apple-system, "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;

    --bg: #0b110d;
    --bg-glow: rgba(83, 224, 140, .07);
    --panel: #111a13;
    --panel-2: #16211a;
    --ink: #d9e4da;
    --dim: #7f8d80;
    --faint: #55645a;
    --line: rgba(217, 228, 218, .13);
    --line-strong: rgba(217, 228, 218, .24);
    --acc: #53e08c;
    --acc-ink: #0c2517;
    --amber: #f0b429;
    --red: #ff6161;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1ea;
      --bg-glow: rgba(13, 138, 79, .06);
      --panel: #ffffff;
      --panel-2: #f6f8f3;
      --ink: #1b251d;
      --dim: #5d6a5f;
      --faint: #8a968d;
      --line: rgba(27, 37, 29, .14);
      --line-strong: rgba(27, 37, 29, .30);
      --acc: #0d8a4f;
      --acc-ink: #f2fbf6;
      --amber: #b07d08;
      --red: #d43c3c;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 42% at 50% -8%, var(--bg-glow), transparent 62%),
      repeating-linear-gradient(0deg, transparent 0 47px, var(--line) 47px 48px),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  /* ---------- 头部 ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 12px; border-bottom: 1px solid var(--line-strong);
  }
  .wordmark {
    font-family: var(--mono); font-size: 15px; font-weight: 700;
    letter-spacing: .22em; color: var(--ink);
  }
  .wordmark span { color: var(--acc); }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    border: 1px solid var(--line); border-radius: 99px;
    padding: 3px 11px 3px 9px; background: var(--panel);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .chip.on .dot { background: var(--acc); box-shadow: 0 0 7px var(--acc); }
  .chip.off .dot { background: var(--red); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- 分区 ---------- */
  main { max-width: 560px; margin: 0 auto; }
  .sec {
    margin-top: 18px; border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    padding: 14px 14px 16px;
    animation: rise .45s cubic-bezier(.2, .7, .2, 1) both;
  }
  .sec:nth-of-type(2) { animation-delay: .07s; }
  .sec:nth-of-type(3) { animation-delay: .14s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .sechead { display: flex; align-items: baseline; gap: 9px; margin-bottom: 11px; }
  .no { font-family: var(--mono); font-size: 11px; color: var(--acc); letter-spacing: .1em; }
  .sechead h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--dim); }
  .sechead .spacer { flex: 1; }

  /* ---------- 目标选择 ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab {
    font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
    color: var(--dim); background: none; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  .tab.active { color: var(--acc); border-color: var(--acc); background: transparent; }
  .pclist { display: grid; gap: 8px; }
  .pc {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--ink); padding: 10px 12px; cursor: pointer; font-family: var(--mono);
    transition: border-color .15s;
  }
  .pc .radio { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; position: relative; }
  .pc[aria-pressed="true"] { border-color: var(--acc); }
  .pc[aria-pressed="true"] .radio { border-color: var(--acc); }
  .pc[aria-pressed="true"] .radio::after {
    content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--acc);
  }
  .pc .cid { font-size: 13px; word-break: break-all; }
  .pc .meta { margin-left: auto; font-size: 11px; color: var(--faint); flex: none; }
  .pc.flash { animation: flash .6s; }
  @keyframes flash { 0% { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); } }

  .empty {
    margin: 0; padding: 14px 4px 2px; color: var(--faint); font-size: 13px;
  }
  .empty code { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  input.mono {
    width: 100%; font-family: var(--mono); font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; outline: none;
  }
  input.mono:focus { border-color: var(--acc); }

  /* ---------- 内容 ---------- */
  .payloadwrap { position: relative; }
  textarea {
    width: 100%; resize: none; display: block;
    font-family: var(--mono); font-size: 16px; line-height: 1.6;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px 12px; outline: none; min-height: 96px;
  }
  textarea:focus { border-color: var(--acc); }
  textarea::placeholder, input.mono::placeholder { color: var(--faint); }
  .interim {
    margin-top: 8px; font-family: var(--mono); font-size: 13px; color: var(--dim);
    padding: 0 4px; min-height: 1.2em;
  }
  .interim::before { content: "◉ "; color: var(--red); }

  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .mic, .send {
    border-radius: 10px; cursor: pointer; font-family: var(--mono);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .mic {
    width: 52px; flex: none; font-size: 19px;
    background: var(--bg); border: 1px solid var(--line); color: var(--dim);
  }
  .mic.live { color: var(--red); border-color: var(--red); animation: pulse 1.3s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 45%, transparent); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }
  .send {
    flex: 1; font-size: 15px; letter-spacing: .2em; font-weight: 700;
    background: var(--acc); border: 1px solid var(--acc); color: var(--acc-ink);
    padding: 13px 0 14px; transition: transform .06s, opacity .15s;
  }
  .send:active { transform: scale(.985); }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { margin: 8px 2px 0; font-size: 12px; color: var(--faint); min-height: 1.2em; }

  /* ---------- 日志 ---------- */
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .log li {
    display: flex; align-items: baseline; gap: 9px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
    padding: 8px 11px; font-family: var(--mono); font-size: 12px;
    animation: rise .3s cubic-bezier(.2, .7, .2, 1) both;
  }
  .log .t { color: var(--faint); flex: none; }
  .log .b {
    flex: none; font-size: 11px; border-radius: 5px; padding: 1px 7px;
    border: 1px solid currentColor; letter-spacing: .05em;
  }
  .b.ok { color: var(--acc); }
  .b.warn { color: var(--amber); }
  .b.err { color: var(--red); }
  .log .x { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ghost {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: none; border: none; cursor: pointer; letter-spacing: .08em;
    padding: 2px 4px; margin-left: auto;
  }
  .ghost:active { color: var(--acc); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: min(88vw, 480px);
    background: var(--panel); border: 1px solid var(--line-strong);
    color: var(--ink); font-family: var(--mono); font-size: 12.5px;
    border-radius: 10px; padding: 10px 15px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .35);
    animation: rise .25s cubic-bezier(.2, .7, .2, 1) both;
    z-index: 9;
  }
  .toast.err { border-color: var(--red); }
</style>
</head>
<body>

<header class="top">
  <div class="wordmark">REMOTE<span>TYPE</span></div>
  <div class="chip" id="srvChip"><i class="dot"></i><span id="srvText">连接中</span></div>
</header>

<main>
  <!-- 01 目标 -->
  <section class="sec">
    <div class="sechead">
      <span class="no">01</span><h2>目标 PC</h2><span class="spacer"></span>
      <button class="ghost" id="refreshBtn">↻ 刷新</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="list" role="tab">在线列表</button>
      <button class="tab" data-tab="manual" role="tab">手动指定</button>
    </div>
    <div id="paneList">
      <div class="pclist" id="pcList"></div>
      <p class="empty" id="pcEmpty" hidden>暂无 PC 上线 —— 在电脑上运行 <code>npx remotetype serve</code></p>
    </div>
    <div id="paneManual" hidden>
      <input class="mono" id="manualId" placeholder="clientId，如 laptop-xxxxxxxx" autocomplete="off" spellcheck="false">
    </div>
  </section>

  <!-- 02 内容 -->
  <section class="sec">
    <div class="sechead">
      <span class="no">02</span><h2>内容</h2><span class="spacer"></span>
      <span class="no" id="charCount" style="color:var(--faint)">0 字</span>
    </div>
    <div class="payloadwrap">
      <textarea id="payload" rows="3" placeholder="输入要注入到 PC 焦点窗口的文字…" autocomplete="off" spellcheck="false"></textarea>
      <div class="interim" id="interim" hidden></div>
    </div>
    <div class="actions">
      <button class="mic" id="micBtn" title="语音输入">🎙</button>
      <button class="send" id="sendBtn">发送 →</button>
    </div>
    <p class="hint" id="micHint"></p>
  </section>

  <!-- 03 日志 -->
  <section class="sec">
    <div class="sechead">
      <span class="no">03</span><h2>传输日志</h2><span class="spacer"></span>
      <button class="ghost" id="clearLog">清空</button>
    </div>
    <ul class="log" id="log"></ul>
    <p class="empty" id="logEmpty">暂无记录</p>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
'use strict';
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var STATUS_TEXT = {
    forwarded: '已转发',
    target_offline: '目标离线',
    rejected_empty: '空文本',
    send_failed: '发送失败'
  };
  var MAX_LOG = 10;
  var entries = [];

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg, isErr) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', Boolean(isErr));
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }

  // ---------- 服务状态 / 在线列表轮询 ----------
  var onlineIds = [];

  function renderChip(ok) {
    $('srvChip').classList.toggle('on', ok);
    $('srvChip').classList.toggle('off', !ok);
    $('srvText').textContent = ok ? '服务在线' : '服务离线';
  }

  function renderClients(clients) {
    onlineIds = clients.map(function (c) { return c.clientId; });
    var wrap = $('pcList');
    wrap.textContent = '';
    $('pcEmpty').hidden = onlineIds.length > 0;
    var selected = localStorage.getItem('rt.target') || '';

    onlineIds.forEach(function (id) {
      var btn = document.createElement('button');
      btn.className = 'pc';
      btn.type = 'button';
      btn.setAttribute('aria-pressed', String(id === selected));

      var radio = document.createElement('i');
      radio.className = 'radio';
      var cid = document.createElement('span');
      cid.className = 'cid';
      cid.textContent = id;
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = '在线';

      btn.append(radio, cid, meta);
      btn.addEventListener('click', function () {
        localStorage.setItem('rt.target', id);
        renderClients(clients);
      });
      wrap.appendChild(btn);
    });
  }

  function poll() {
    Promise.allSettled([
      fetch('/health').then(function (r) { return r.json(); }),
      fetch('/clients').then(function (r) { return r.json(); })
    ]).then(function (rs) {
      renderChip(rs[0].status === 'fulfilled' && rs[0].value.ok === true);
      if (rs[1].status === 'fulfilled' && Array.isArray(rs[1].value.clients)) {
        renderClients(rs[1].value.clients);
      }
    });
  }

  $('refreshBtn').addEventListener('click', function () { poll(); toast('已刷新'); });
  poll();
  setInterval(poll, 3000);

  // ---------- tab 切换 ----------
  var activeTab = localStorage.getItem('rt.tab') || 'list';
  function applyTab() {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === activeTab);
    });
    $('paneList').hidden = activeTab !== 'list';
    $('paneManual').hidden = activeTab !== 'manual';
    localStorage.setItem('rt.tab', activeTab);
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { activeTab = t.dataset.tab; applyTab(); });
  });
  applyTab();
  $('manualId').value = localStorage.getItem('rt.manual') || '';
  $('manualId').addEventListener('input', function () {
    localStorage.setItem('rt.manual', this.value);
  });

  function effectiveTarget() {
    if (activeTab === 'manual') return $('manualId').value.trim();
    return localStorage.getItem('rt.target') || '';
  }

  // ---------- 输入 ----------
  var payload = $('payload');
  payload.addEventListener('input', function () {
    $('charCount').textContent = payload.value.length + ' 字';
    autoGrow();
  });
  function autoGrow() {
    payload.style.height = 'auto';
    payload.style.height = Math.max(96, payload.scrollHeight) + 'px';
  }
  payload.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') send();
  });

  // ---------- 发送 ----------
  function currentClock() {
    return new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  function renderLog() {
    var ul = $('log');
    ul.textContent = '';
    $('logEmpty').hidden = entries.length > 0;
    entries.forEach(function (en) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = en.time;
      var b = document.createElement('span');
      b.className = 'b ' + en.cls;
      b.textContent = en.status;
      var x = document.createElement('span');
      x.className = 'x';
      x.textContent = en.preview + ' · ' + en.target;
      li.append(t, b, x);
      ul.appendChild(li);
    });
  }

  function send() {
    var text = payload.value;
    var target = effectiveTarget();
    if (!target) { toast('请先选择目标 PC（或手动指定 clientId）', true); return; }
    if (!text.trim()) { toast('内容为空', true); return; }

    var btn = $('sendBtn');
    btn.disabled = true;
    fetch('/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: target, text: text })
    }).then(function (r) {
      return r.json().catch(function () { throw new Error('HTTP ' + r.status); });
    }).then(function (res) {
      var ok = res.ok === true;
      entries.unshift({
        time: currentClock(),
        cls: ok ? 'ok' : 'err',
        status: STATUS_TEXT[res.status] || res.status || '未知',
        preview: text.length > 18 ? text.slice(0, 18) + '…' : text,
        target: target
      });
      entries = entries.slice(0, MAX_LOG);
      renderLog();
      if (ok) {
        payload.value = '';
        $('charCount').textContent = '0 字';
        autoGrow();
        toast('已转发 → ' + target);
      } else {
        toast(STATUS_TEXT[res.status] || res.status || '发送失败', true);
      }
    }).catch(function (e) {
      entries.unshift({
        time: currentClock(), cls: 'err', status: '网络错误',
        preview: text.slice(0, 18), target: target
      });
      entries = entries.slice(0, MAX_LOG);
      renderLog();
      toast('网络错误：' + e.message, true);
    }).finally(function () {
      btn.disabled = false;
    });
  }
  $('sendBtn').addEventListener('click', send);
  $('clearLog').addEventListener('click', function () {
    entries = [];
    renderLog();
  });

  // ---------- 语音输入（Web Speech API，需 HTTPS / localhost） ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  var listening = false;
  var micHint = $('micHint');

  function hint(msg) { micHint.textContent = msg || ''; }

  if (!SR) {
    hint('此浏览器不支持语音识别，可直接输入文字');
  } else if (!window.isSecureContext) {
    hint('语音识别需 HTTPS 环境（当前为 http），可先直接输入文字');
  }

  function stopRec() {
    listening = false;
    $('micBtn').classList.remove('live');
    $('interim').hidden = true;
    if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } }
  }

  function appendFinal(text) {
    if (!text) return;
    payload.value += text;
    payload.dispatchEvent(new Event('input'));
    payload.focus();
  }

  $('micBtn').addEventListener('click', function () {
    if (!SR) { toast('此浏览器不支持语音识别', true); return; }
    if (!window.isSecureContext) {
      toast('语音识别需要 HTTPS，当前 http 连接不支持', true);
      return;
    }
    if (listening) { stopRec(); return; }

    rec = new SR();
    rec.lang = 'zh-CN';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onresult = function (ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        if (r.isFinal) appendFinal(r[0].transcript.trim());
        else interim += r[0].transcript;
      }
      var box = $('interim');
      box.hidden = !interim;
      box.textContent = interim;
    };
    rec.onerror = function (ev) {
      var msg = {
        'not-allowed': '麦克风权限被拒绝',
        'service-not-allowed': '语音服务不可用（可能缺少 Google 服务）',
        'network': '语音服务网络错误',
        'no-speech': '未检测到语音'
      }[ev.error] || ('识别出错：' + ev.error);
      toast(msg, true);
      stopRec();
    };
    rec.onend = function () {
      if (listening) { try { rec.start(); } catch (e) { stopRec(); } }
      else { $('micBtn').classList.remove('live'); $('interim').hidden = true; }
    };

    try {
      rec.start();
      listening = true;
      $('micBtn').classList.add('live');
      hint('聆听中，点击麦克风停止；识别结果会填入输入框，可修改后再发送');
    } catch (e) {
      toast('无法启动语音识别：' + e.message, true);
    }
  });

  renderLog();
})();
</script>
</body>
</html>
