# Deploy — GHCR 派：runner build+push ghcr.io → 服务器 pull。
#
# 对比 ref4（save→scp→load）省了 30+ 分钟 GHA→服务器跨境外网传镜像。
# 镜像走 GHCR（服务器 0.5s 通），scp 只传一个 ~250 字节的 docker 配置。
#
# 服务器档案 / secrets 配置 / 运维命令：见 server/DEPLOY.md
#
# Secrets:
#   HOST / USERNAME / PORT / SSH_KEY —— 部署机 SSH（与 ref4 共用）
#   GHCR_TOKEN（推荐）—— PAT，read:packages；服务器 pull 鉴权用
#   RT_TOKEN（可选）—— 注册门禁

name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: On-DevPlan
  IMAGE_REPO: mn-rt
  IMAGE_NAME: rt-server
  IMAGE_FULL: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (push side)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FULL }}:latest
            ${{ env.IMAGE_FULL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4 个 secret 长度诊断，任一没配/配错第一时间在日志里看到
      - name: Diagnose secrets (length only)
        if: always()
        env:
          HOST_LEN:     ${{ secrets.HOST }}
          USERNAME_LEN: ${{ secrets.USERNAME }}
          SSH_KEY_LEN:  ${{ secrets.SSH_KEY }}
          PORT_LEN:     ${{ secrets.PORT }}
          GHCR_TOKEN_LEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "HOST length: ${#HOST_LEN}"
          echo "USERNAME length: ${#USERNAME_LEN}"
          echo "SSH_KEY length: ${#SSH_KEY_LEN}"
          echo "PORT length: ${#PORT_LEN}"
          echo "GHCR_TOKEN length: ${#GHCR_TOKEN_LEN} (0=未配，服务器将走匿名 pull，可能 401)"

      # 把 GHCR pull 用的鉴权文件以 artifact 形式从 build 传到 deploy（ref1 坑 1：
      # job output 会被 secret-scanner 拦，artifact 文件不被扫值）
      - name: Write docker pull config
        if: ${{ secrets.GHCR_TOKEN }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -e
          AUTH_B64=$(printf 'oauth2:%s' "$GHCR_TOKEN" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH_B64" > docker_config.json
          echo "wrote docker_config.json ($(wc -c < docker_config.json) bytes)"

      - name: Upload docker config
        if: ${{ secrets.GHCR_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-config
          path: docker_config.json
          retention-days: 1

      - name: Download docker config
        if: ${{ secrets.GHCR_TOKEN }}
        uses: actions/download-artifact@v4
        with:
          name: docker-config
          path: .
          merge-multiple: true

      - name: Copy config to server
        if: ${{ secrets.GHCR_TOKEN }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "docker_config.json"
          target: "~/app/"
          timeout: 2m

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          RT_TOKEN: ${{ secrets.RT_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          envs: RT_TOKEN
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            cd ~/app

            # 仅当 runner 端写了 docker_config.json 时才安装
            if [ -s docker_config.json ]; then
              mkdir -p ~/.docker
              mv -f docker_config.json ~/.docker/config.json
              chmod 600 ~/.docker/config.json
              echo "docker pull config installed (authenticated)"
            else
              echo "docker pull config: 缺 GHCR_TOKEN，匿名 pull（公开包 OK，私有/同步延迟场景会 401）"
            fi

            IMAGE="${{ env.IMAGE_FULL }}:latest"
            CONTAINER_NAME=remotetype_server
            HOST_PORT=8790

            # pull 包在 12min 内：ref1 坑 3（GHCR 慢网络兜底），
            # 超时也不阻断 deploy，本地缓存能用就用（GHCR 公开包亦然）
            echo "Pulling ${IMAGE}..."
            timeout 720 docker pull "${IMAGE}" \
              && echo "pull ok" \
              || echo "WARN: pull failed/timeout (fallback to local cache)"

            # 镜像必须存在（刚 pull 成功 or 之前缓存）
            docker image inspect "${IMAGE}" > /dev/null \
              || { echo "no image at all（pull 失败且无缓存）"; exit 1; }

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm   "${CONTAINER_NAME}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --memory 256m \
              -p "${HOST_PORT}:8790" \
              -v mn_rt_data:/app/data \
              -v mn_rt_logs:/app/logs \
              ${RT_TOKEN:+-e RT_TOKEN="$RT_TOKEN"} \
              "${IMAGE}"

            MAX=6; i=0; ok=false
            while [ $i -lt $MAX ]; do
              i=$((i + 1))
              echo "Health $i/$MAX..."
              if curl -f -s "http://localhost:${HOST_PORT}/health" > /dev/null; then
                ok=true; echo "Health passed!"; break
              fi
              sleep 10
            done

            if [ "$ok" = false ]; then
              echo "Health FAILED. Recent logs:"
              docker logs "${CONTAINER_NAME}" --tail 60
              exit 1
            fi

            docker image prune -f > /dev/null || true
            echo "Deployment successful!"
