# Deploy — GHCR 派：runner build+push ghcr.io → 服务器 pull。
#
# 对比 ref4（save→scp→load）省了 30+ 分钟 GHA→服务器跨境外网传镜像。
# 镜像走 GHCR（服务器 0.5s 通），scp 只传一个 ~250 字节的 docker 配置。
#
# 服务器档案 / secrets 配置 / 运维命令：见 server/DEPLOY.md
#
# Secrets:
#   HOST / USERNAME / PORT / SSH_KEY —— 部署机 SSH（与 ref4 共用）
#   GHCR_TOKEN（推荐）—— PAT，read:packages；服务器 pull 鉴权用
#   RT_TOKEN（可选）—— 注册门禁

name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像完整名：workflow 级 env 不支持 ${{ env.X }} 自引用，直接写死
  # GHCR 要求 owner 全小写
  IMAGE_FULL: ghcr.io/on-devplan/mn-rt/rt-server

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (push side)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FULL }}:latest
            ${{ env.IMAGE_FULL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push 后尽量把包设为 public——避免 GHCR visibility 同步怪象导致
      # 公开包匿名 pull 仍 401。
      #
      # ⚠️ 已知限制：该 PATCH 对「组织所有」的 package 恒返回 404。
      # GitHub 官方 troubleshooting 明确：GITHUB_TOKEN 只能操作 workflow 所属
      # 「仓库」的资源；组织级 package 属资源需 PAT（classic write:packages
      # 或 fine-grained Packages: write）。URL 与 %2F 编码本身没问题。
      #
      # 服务器侧已改为带 GHCR_TOKEN 鉴权 pull，不依赖包是否 public。
      # 因此这里失败只告警、不阻断部署（continue-on-error + 不 exit 1）。
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: On-DevPlan
          PKG_NAME: mn-rt/rt-server
        run: |
          # 路径是 /orgs/{org}/packages/{type}/{name}（不是 /visibilities 后缀），
          # 名字里的 '/' 需 URL-encode 成 %2F
          PKG_ENC=$(printf '%s' "$PKG_NAME" | sed 's|/|%2F|g')
          URL="https://api.github.com/orgs/${ORG}/packages/container/${PKG_ENC}"
          echo "PATCH $URL"
          HTTP=$(curl -s -o /tmp/vis_resp.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$URL" \
            -d '{"visibility":"public"}' || echo "000")
          echo "PATCH status: $HTTP"
          echo "response body:"
          head -c 400 /tmp/vis_resp.json 2>/dev/null || true
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::warning::visibility PATCH 未成功 (status $HTTP)——不阻断部署，服务器将用 GHCR_TOKEN 鉴权 pull"
          else
            echo "package visibility set to public"
          fi

      # 4 个 secret 长度诊断，任一没配/配错第一时间在日志里看到
      - name: Diagnose secrets (length only)
        if: always()
        env:
          HOST_LEN:     ${{ secrets.HOST }}
          USERNAME_LEN: ${{ secrets.USERNAME }}
          SSH_KEY_LEN:  ${{ secrets.SSH_KEY }}
          PORT_LEN:     ${{ secrets.PORT }}
          GHCR_TOKEN_LEN: ${{ secrets.GHCR_TOKEN }}
          RT_AUTH_ENABLED_VAL: ${{ secrets.RT_AUTH_ENABLED }}
          RT_AUTH_JWT_SECRET_LEN: ${{ secrets.RT_AUTH_JWT_SECRET }}
        run: |
          echo "HOST length: ${#HOST_LEN}"
          echo "USERNAME length: ${#USERNAME_LEN}"
          echo "SSH_KEY length: ${#SSH_KEY_LEN}"
          echo "PORT length: ${#PORT_LEN}"
          echo "GHCR_TOKEN length: ${#GHCR_TOKEN_LEN} (0=未配，服务器将走匿名 pull，可能 401)"
          # 统一登录的两项单独打：enabled 决定后面所有属主判据是否存在；
          # JWT_SECRET 在开启时缺失会让容器**拒绝启动**（不是降级运行），
          # 这里先说清楚，免得只看到一串 restart 日志找不到原因。
          echo "RT_AUTH_ENABLED: '${RT_AUTH_ENABLED_VAL:-<未配, 关闭>}' (认 1/true/yes/on)"
          echo "RT_AUTH_JWT_SECRET length: ${#RT_AUTH_JWT_SECRET_LEN} (开启时 0 = 容器拒绝启动)"
          if [ -n "${RT_AUTH_ENABLED_VAL:-}" ] && [ -z "${RT_AUTH_JWT_SECRET_LEN:-}" ]; then
            case "$(printf '%s' "$RT_AUTH_ENABLED_VAL" | tr 'A-Z' 'a-z')" in
              1|true|yes|on) echo "::error::RT_AUTH_ENABLED 已开启但 RT_AUTH_JWT_SECRET 未配，部署必然失败"; exit 1;;
            esac
          fi

      # 把 GHCR pull 用的鉴权文件以 artifact 形式从 build 传到 deploy（ref1 坑 1：
      # job output 会被 secret-scanner 拦，artifact 文件不被扫值。
      # GHCR_TOKEN 缺失时写一个空 auth 的 config（base64 of "oauth2:"），
      # 服务器 pull 会 401——用户从部署日志一眼能看到。
      - name: Write docker pull config
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || '' }}
        run: |
          AUTH_B64=$(printf 'oauth2:%s' "$GHCR_TOKEN" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH_B64" > docker_config.json
          echo "wrote docker_config.json ($(wc -c < docker_config.json) bytes)"

      - name: Upload docker config
        uses: actions/upload-artifact@v4
        with:
          name: docker-config
          path: docker_config.json
          retention-days: 1

      - name: Download docker config
        uses: actions/download-artifact@v4
        with:
          name: docker-config
          path: .
          merge-multiple: true

      - name: Copy config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "docker_config.json"
          target: "~/app/"
          timeout: 2m

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          RT_TOKEN: ${{ secrets.RT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || '' }}
          RT_AUTH_ENABLED: ${{ secrets.RT_AUTH_ENABLED || '' }}
          RT_AUTH_JWT_SECRET: ${{ secrets.RT_AUTH_JWT_SECRET || '' }}
          RT_AUTH_ISSUER: ${{ secrets.RT_AUTH_ISSUER || '' }}
          RT_AUTH_CLIENT_ID: ${{ secrets.RT_AUTH_CLIENT_ID || '' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          envs: RT_TOKEN,GHCR_TOKEN,RT_AUTH_ENABLED,RT_AUTH_JWT_SECRET,RT_AUTH_ISSUER,RT_AUTH_CLIENT_ID
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            cd ~/app

            # GHCR_TOKEN 非空才装认证 config；空则匿名 pull（公开包 OK）
            if [ -n "$GHCR_TOKEN" ] && [ -s docker_config.json ]; then
              mkdir -p ~/.docker
              mv -f docker_config.json ~/.docker/config.json
              chmod 600 ~/.docker/config.json
              echo "docker pull config installed (authenticated)"
            else
              rm -f docker_config.json  # 避免被误以为已装
              echo "docker pull: GHCR_TOKEN 未配，匿名 pull（公开包 OK）"
            fi

            IMAGE="${{ env.IMAGE_FULL }}:latest"
            CONTAINER_NAME=remotetype_server
            HOST_PORT=8790

            echo "Pulling ${IMAGE}..."
            timeout 720 docker pull "${IMAGE}" \
              && echo "pull ok" \
              || echo "WARN: pull failed/timeout (fallback to local cache)"

            docker image inspect "${IMAGE}" > /dev/null \
              || { echo "no image at all（pull 失败且无缓存）"; exit 1; }

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm   "${CONTAINER_NAME}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --memory 256m \
              -p "${HOST_PORT}:8790" \
              -v mn_rt_data:/app/data \
              -v mn_rt_logs:/app/logs \
              ${RT_TOKEN:+-e RT_TOKEN="$RT_TOKEN"} \
              ${RT_AUTH_ENABLED:+-e RT_AUTH_ENABLED="$RT_AUTH_ENABLED"} \
              ${RT_AUTH_JWT_SECRET:+-e RT_AUTH_JWT_SECRET="$RT_AUTH_JWT_SECRET"} \
              ${RT_AUTH_ISSUER:+-e RT_AUTH_ISSUER="$RT_AUTH_ISSUER"} \
              ${RT_AUTH_CLIENT_ID:+-e RT_AUTH_CLIENT_ID="$RT_AUTH_CLIENT_ID"} \
              "${IMAGE}"

            # ── 部署后必须验一次"配了的确实生效了" ────────────────────────────
            # 不是多余的保险：RT_AUTH_ENABLED 曾经只认字面 'true'，
            # compose/secrets 里写 1 会被判成关闭，而服务照常起、/health 照样绿。
            # 那等于整套属主隔离静默不存在，CI 全绿、人以为开着。
            # 所以判据必须打在"运行中的进程怎么说"上，而不是"我传了什么"上。
            AUTH_WANT="${RT_AUTH_ENABLED:-}"
            case "$(printf '%s' "$AUTH_WANT" | tr 'A-Z' 'a-z')" in
              1|true|yes|on) AUTH_WANT=true ;;
              0|false|no|off|"") AUTH_WANT=false ;;
              *) echo "RT_AUTH_ENABLED 取值无法识别: $AUTH_WANT"; exit 1 ;;
            esac
            AUTH_SECRET_SET=false
            [ -n "$RT_AUTH_JWT_SECRET" ] && AUTH_SECRET_SET=true
            echo "verify auth: want=$AUTH_WANT secret_set=$AUTH_SECRET_SET"

            MAX=6; i=0; ok=false
            while [ $i -lt $MAX ]; do
              i=$((i + 1))
              echo "Health $i/$MAX..."
              if curl -f -s "http://localhost:${HOST_PORT}/health" > /dev/null; then
                ok=true; echo "Health passed!"; break
              fi
              sleep 10
            done

            if [ "$ok" = false ]; then
              echo "Health FAILED. Recent logs:"
              docker logs "${CONTAINER_NAME}" --tail 60
              exit 1
            fi

            # ── 运行态断言：进程自己报的 enabled 必须与本次意图一致 ──
            CFG=$(curl -s -m 10 "http://localhost:${HOST_PORT}/auth/oidc/config")
            echo "GET /auth/oidc/config -> $CFG"
            AUTH_IS=$(printf '%s' "$CFG" | sed -n 's/.*"enabled":\([a-z]*\).*/\1/p')
            if [ "$AUTH_IS" != "$AUTH_WANT" ]; then
              echo "统一登录状态与部署意图不符：期望 enabled=$AUTH_WANT，实际 '${AUTH_IS:-无}'"
              echo "（这正是「配了 1 却被当成关闭」那类静默失效的形态，不要放行）"
              docker logs "${CONTAINER_NAME}" --tail 40
              exit 1
            fi
            if [ "$AUTH_WANT" = "true" ]; then
              # 认证中心可达性必须在**服务端侧**验，不是本机：浏览器能打开认证中心
              # 不代表容器出得去。idpAvailable 只有真的拉到发现文档才会是 true。
              if ! printf '%s' "$CFG" | grep -q '"idpAvailable":true'; then
                echo "统一登录已开启但拉不到认证中心发现文档（容器到 issuer 的网络不通）"
                echo "  issuer=$(printf '%s' "$CFG" | sed -n 's/.*"issuer":"\([^"]*\)".*/\1/p')"
                docker logs "${CONTAINER_NAME}" --tail 40
                exit 1
              fi
              echo "auth ok: enabled + idpAvailable"
            fi

            docker image prune -f > /dev/null || true
            echo "Deployment successful!"
