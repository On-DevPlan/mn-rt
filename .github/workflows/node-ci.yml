name: node-ci

# mn-rt monorepo 的 JS 侧检查。
# 覆盖两个包：
#   server/  公网 Serve 服务端
#   client/  PC 客户端 CLI
#
# 说明：client 的 optionalDependencies 指向各平台注入引擎分包（尚未发布到 npm），
# 因此这里用 --omit=optional 安装，避免因缺失可选依赖而失败。

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/node-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci --omit=optional

      - name: 语法检查
        run: |
          for f in src/*.js; do
            node --check "$f"
            echo "OK $f"
          done

      # 统一登录的属主判据必须有地方真的跑起来。写在仓库里没人执行的测试
      # 不是保护，是安慰剂——尤其是"跨属主不得回显会话密钥"这一类，
      # 回归时表现是完全静默的（接口照答、服务照起）。
      #
      # 写成**不加引号**的 glob，让 bash 先展成真实文件名再交给 node。
      # 两个写法各死在一边：`test/`（目录）Node 20 认、Node 22 不认，后者把它当模块
      # require，报 "Cannot find module .../server/test"；'test/*.test.js'（带引号）
      # 反过来是 Node 20 不支持在 --test 里做通配，报 "Could not find ..."。
      # 只有交给 shell 展开才是两版都成立的写法——所以引号必须去掉。
      - name: 统一登录与属主单元测试
        shell: bash
        run: node --test test/*.test.js

      - name: 启动冒烟测试（/health、/stats、/push 空文本拒绝）
        run: |
          set -euo pipefail
          RT_PORT=18899 RT_RECORD_FILE=/tmp/records.jsonl RT_LOG_DIR=/tmp/logs \
            node src/server.js >/tmp/server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18899/health >/dev/null && break
            sleep 0.5
          done

          echo "--- /health ---"
          curl -sf http://127.0.0.1:18899/health | tee /dev/stderr | grep -q '"ok":true'

          echo "--- /stats ---"
          curl -sf http://127.0.0.1:18899/stats | tee /dev/stderr | grep -q 'records'

          echo "--- /push 空文本应被拒绝 ---"
          RESP=$(curl -s -X POST http://127.0.0.1:18899/push \
            -H 'Content-Type: application/json' \
            -d '{"clientId":"nobody","text":"   "}')
          echo "$RESP"
          echo "$RESP" | grep -q 'rejected_empty'

          echo "--- /push 目标离线应告警 ---"
          RESP2=$(curl -s -X POST http://127.0.0.1:18899/push \
            -H 'Content-Type: application/json' \
            -d '{"clientId":"nobody","text":"hello"}')
          echo "$RESP2"
          echo "$RESP2" | grep -q 'target_offline'

          echo "服务端冒烟测试通过"

  client:
    name: client (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖
        run: npm ci --omit=optional

      - name: 语法检查
        shell: bash
        run: |
          for f in bin/index.js lib/*.js; do
            node --check "$f"
            echo "OK $f"
          done

      - name: CLI 冒烟测试（help / binary）
        shell: bash
        run: |
          set -uo pipefail
          # help 必须正常输出且列出子命令
          node bin/index.js help | grep -q 'serve'
          node bin/index.js help | grep -q 'doctor'
          node bin/index.js help | grep -q 'auth login'
          # auth 子命令必须可达：没登录过时 status 要正常报告"未登录"而不是崩
          node bin/index.js auth status
          # 未知子命令必须以非零码退出（静默成功会让脚本调用方以为做了什么）
          if node bin/index.js auth nosuchsub; then
            echo "未知 auth 子命令应以非零码退出，实际 0"
            exit 1
          fi
          # binary 在没有预置二进制的平台上会以非零码退出（这是正确行为），
          # 因此这里只校验它能正常打印查找路径，不断言退出码。
          node bin/index.js binary || true

      - name: 单元测试（文本预处理 / 队列 / 平台识别 / 统一登录）
        shell: bash
        run: node test/unit.js

  e2e:
    name: 端到端联调（离线自起服务端）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 三个 e2e 都同时 require client/lib 与 server/src，
      # 所以两侧依赖都要装（ws 只装在 client 下，是它们的共同前提）。
      - name: 安装依赖
        run: |
          npm ci --prefix client --omit=optional
          npm ci --prefix server --omit=optional

      # 统一登录的完整链路：门禁 → 属主绑定 → 跨属主拒绝 → 密钥下发 → 真实信封往返。
      # 不需要真的认证中心（设备令牌是本服务自签的 HS256，测试里同密钥离签即可），
      # 所以这条能在 CI 上稳定跑，覆盖的却是与线上完全相同的代码路径。
      - name: 统一登录端到端
        run: node test/auth-e2e.js

      - name: 对齐模式端到端（含旧 RT_TOKEN 路径）
        run: node test/align-e2e.js

      - name: 网页控制台端到端
        run: node test/webclient-e2e.js

  unit:
    name: rust unit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev pkg-config

      - name: cargo test
        working-directory: rust/input-agent
        run: cargo test --features linux-x11 --verbose

      - name: cargo fmt 检查
        working-directory: rust/input-agent
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: rust/input-agent
        run: cargo clippy --features linux-x11 -- -D warnings
