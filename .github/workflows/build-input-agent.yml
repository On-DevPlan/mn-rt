name: build-input-agent

# 多平台编译 Rust 注入引擎，产出可直接分发的静态二进制。
#
# mn-rt monorepo 说明：
#   本仓库除 Rust 注入引擎外还含 server/（公网服务端）与 client/（PC 客户端 CLI）。
#   两者由独立的 node-ci.yml 负责检查；本文件只关注 Rust 产物。
#
# 产物目录结构（与 client/lib/platform.js 的查找路径一致）：
#   win32-x64/input-agent.exe
#   darwin-x64/input-agent
#   darwin-arm64/input-agent
#   linux-x64/input-agent
#
# 触发方式：
#   * 打 tag（v*）时自动编译并创建 Release 并上传产物；
#   * 修改 rust/ 或本文件时在 PR / main 上做编译校验；
#   * 手动 workflow_dispatch 也可以只编译、留档 artifact。

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/build-input-agent.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/build-input-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows x64 ----
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: win32-x64
            binary: input-agent.exe
            features: ""
            linux: false

          # ---- macOS x64（Intel） ----
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: darwin-x64
            binary: input-agent
            features: ""
            linux: false

          # ---- macOS arm64（Apple Silicon） ----
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-arm64
            binary: input-agent
            features: ""
            linux: false

          # ---- Linux x64（X11） ----
          # ubuntu-22.04 → glibc 2.35。如需更低 glibc 兼容性，
          # 可改为在 ubuntu-22.04 上使用 cross 或容器构建。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            binary: input-agent
            features: "--features linux-x11"
            linux: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 注意：mn-rt 是 monorepo，工程根在 rust/input-agent，
      # 而 wkeysym patch 指向 ../vendor/xkeysym，因此缓存键需覆盖两个 Cargo.toml。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/input-agent/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('rust/input-agent/Cargo.toml', 'rust/vendor/xkeysym/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # Linux 构建依赖：enigo 的 x11rb 后端需要 xkbcommon（X11 键位映射）
      - name: 安装 Linux 构建依赖
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev pkg-config

      # 冒烟测试的 hotkey / enter_mode 步骤会真实注入键事件，需要一个 X server。
      # 起无头 Xvfb 供 enigo 连接（此前步骤 1-4 不注入，缺 Xvfb 的问题一直没暴露）。
      - name: 启动 Xvfb（注入冒烟测试用）
        if: matrix.linux
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: 编译 release
        working-directory: rust/input-agent
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: 整理产物到平台目录
        shell: bash
        run: |
          set -euo pipefail
          SRC="rust/input-agent/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          OUT="dist/${{ matrix.artifact }}"
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/${{ matrix.binary }}"
          # 计算校验和，便于用户验证下载完整性
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 "$OUT/${{ matrix.binary }}" > "$OUT/SHA256SUMS.txt"
          else
            sha256sum "$OUT/${{ matrix.binary }}" > "$OUT/SHA256SUMS.txt"
          fi
          echo "--- 产物 ---"
          ls -lh "$OUT"
          cat "$OUT/SHA256SUMS.txt"

      - name: 冒烟测试（Linux：校验可执行 + 协议应答）
        if: matrix.linux
        shell: bash
        run: |
          set -uo pipefail
          BIN="dist/${{ matrix.artifact }}/${{ matrix.binary }}"
          # 注意：断言不要依赖 JSON 键顺序（serde 按字段声明顺序输出，
          # 与直觉书写顺序可能不一致），统一用 grep 做结构化匹配。
          # 1) ping 指令应返回 ok:true + msg:pong
          RESP=$(echo '{"action":"ping"}' | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "ping 应答: $RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::ping 应答缺少 ok:true"; exit 1 ;;
          esac
          case "$RESP" in
            *'"pong"'*) : ;;
            *) echo "::error::ping 应答缺少 pong"; exit 1 ;;
          esac
          # 2) 非法 JSON 应返回 ok:false 且不崩溃
          RESP2=$(echo 'not-json' | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "非法输入应答: $RESP2"
          case "$RESP2" in
            *'"ok":false'*) echo "非法输入被正确拒绝" ;;
            *) echo "::error::非法 JSON 处理异常"; exit 1 ;;
          esac
          # 3) 未知 action 应返回 ok:false 且进程存活
          RESP3=$(printf '{"action":"no_such_action"}\n{"action":"ping"}\n' \
            | timeout 10 "$BIN" 2>/dev/null | tr '\n' ' ')
          echo "未知 action 应答: $RESP3"
          case "$RESP3" in
            *'"ok":false'*'"pong"'*) echo "未知 action 被拒绝且进程继续服务" ;;
            *) echo "::error::未知 action 处理异常"; exit 1 ;;
          esac
          # 4) 空行应被忽略，进程正常退出
          printf '\n\n' | timeout 10 "$BIN" >/dev/null 2>&1
          echo "空输入处理正常"
          # 5) hotkey：Shift+Return 组合。Xvfb 键表自带 Shift/Return 的物理键码，
          #    无需临时重映射即可完成「修饰键按下→主键单击→松开」全链路
          RESP4=$(printf '{"action":"hotkey","key":"return","modifiers":["shift"]}\n' \
            | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "hotkey 应答: $RESP4"
          case "$RESP4" in
            *'"ok":true'*'hotkey complete'*'shift+return'*) echo "hotkey 组合键注入成功" ;;
            *) echo "::error::hotkey 处理异常"; exit 1 ;;
          esac
          # 6) 非法 enter_mode 应立即报错且不注入（宁可失败不做静默回退）
          RESP5=$(echo '{"action":"type_text","text":"a","enter_mode":"bogus"}' \
            | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "非法 enter_mode 应答: $RESP5"
          case "$RESP5" in
            *'"ok":false'*'invalid enter_mode'*) echo "非法 enter_mode 被正确拒绝" ;;
            *) echo "::error::非法 enter_mode 处理异常"; exit 1 ;;
          esac
          # 7) enter_mode=shift_enter：多行文本应完成「打字 + Shift+Enter 换行」全链路
          #    （Xvfb 无真实窗口，键事件无处显示但协议链路完整可验证）
          RESP6=$(printf '{"action":"type_text","text":"a\\nb","enter_mode":"shift_enter"}\n' \
            | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "enter_mode 应答: $RESP6"
          case "$RESP6" in
            *'"ok":true'*) echo "shift_enter 换行注入成功" ;;
            *) echo "::error::enter_mode=shift_enter 处理异常"; exit 1 ;;
          esac

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: input-agent-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error

  # 打 tag 时汇总所有平台产物并创建 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: 校验各平台产物齐全
        run: |
          set -euo pipefail
          for d in win32-x64 darwin-x64 darwin-arm64 linux-x64; do
            ls -lh "dist/input-agent-$d" || { echo "::error::缺少 $d 产物"; exit 1; }
          done
          find dist -type f | sort

      # GitHub Release 的资产是「扁平」的：不同平台若都叫 input-agent，
      # 上传时会互相覆盖，最终只剩最后一个。因此统一加上平台前缀，
      # 形如 input-agent-linux-x64 / input-agent-win32-x64.exe。
      - name: 重命名为带平台前缀的产物
        run: |
          set -euo pipefail
          mkdir -p upload
          for d in win32-x64 darwin-x64 darwin-arm64 linux-x64; do
            SRC="dist/input-agent-$d"
            BIN=$(ls "$SRC" | grep -v SHA256SUMS | head -1)
            EXT=""
            [[ "$BIN" == *.exe ]] && EXT=".exe"
            TGT="input-agent-$d$EXT"
            cp "$SRC/$BIN" "upload/$TGT"
            # 用新名字重算校验和，避免用户校验时对不上文件名
            if command -v sha256sum >/dev/null 2>&1; then
              ( cd upload && sha256sum "$TGT" >> SHA256SUMS-all.txt )
            else
              ( cd upload && shasum -a 256 "$TGT" >> SHA256SUMS-all.txt )
            fi
          done
          echo "--- 待上传 ---"
          ls -lh upload
          echo "--- 校验和 ---"
          cat upload/SHA256SUMS-all.txt

      - name: 创建 Release 并上传分平台产物
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          draft: false
          body: |
            ## RemoteType input-agent ${{ github.ref_name }}

            预编译的字符注入引擎（无需用户安装 Rust）。

            | 资产 | 平台 | 说明 |
            | --- | --- | --- |
            | `input-agent-win32-x64.exe` | Windows x64 | 需加入杀毒软件白名单 |
            | `input-agent-darwin-x64` | macOS Intel | 需开启「辅助功能」权限 |
            | `input-agent-darwin-arm64` | macOS Apple Silicon | 需开启「辅助功能」权限 |
            | `input-agent-linux-x64` | Linux x64 | **仅支持 X11，Wayland 不支持** |

            `SHA256SUMS-all.txt` 含全部资产的校验和，可用于验证下载完整性。

            > 自行部署时，请把下载到的文件放为
            > `<缓存目录>/<平台>-<架构>/input-agent[.exe]`，
            > 或用 `remotetype serve --agent <路径>` 手动指定。
