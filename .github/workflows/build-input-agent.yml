name: build-input-agent

# 多平台编译 Rust 注入引擎，产出可直接分发的静态二进制。
#
# mn-rt monorepo 说明：
#   本仓库除 Rust 注入引擎外还含 server/（公网服务端）与 client/（PC 客户端 CLI）。
#   两者由独立的 node-ci.yml 负责检查；本文件只关注 Rust 产物。
#
# 产物目录结构（与 client/lib/platform.js 的查找路径一致）：
#   win32-x64/input-agent.exe
#   darwin-x64/input-agent
#   darwin-arm64/input-agent
#   linux-x64/input-agent
#
# 触发方式：
#   * 打 tag（v*）时自动编译并创建 Release 并上传产物；
#   * 修改 rust/ 或本文件时在 PR / main 上做编译校验；
#   * 手动 workflow_dispatch 也可以只编译、留档 artifact。

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/build-input-agent.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/build-input-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows x64 ----
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: win32-x64
            binary: input-agent.exe
            features: ""
            linux: false

          # ---- macOS x64（Intel） ----
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: darwin-x64
            binary: input-agent
            features: ""
            linux: false

          # ---- macOS arm64（Apple Silicon） ----
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-arm64
            binary: input-agent
            features: ""
            linux: false

          # ---- Linux x64（X11） ----
          # ubuntu-22.04 → glibc 2.35。如需更低 glibc 兼容性，
          # 可改为在 ubuntu-22.04 上使用 cross 或容器构建。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            binary: input-agent
            features: "--features linux-x11"
            linux: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 注意：mn-rt 是 monorepo，工程根在 rust/input-agent，
      # 而 wkeysym patch 指向 ../vendor/xkeysym，因此缓存键需覆盖两个 Cargo.toml。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/input-agent/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('rust/input-agent/Cargo.toml', 'rust/vendor/xkeysym/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # Linux 构建依赖：enigo 的 x11rb 后端需要 xkbcommon（X11 键位映射）
      - name: 安装 Linux 构建依赖
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev pkg-config

      - name: 编译 release
        working-directory: rust/input-agent
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: 整理产物到平台目录
        shell: bash
        run: |
          set -euo pipefail
          SRC="rust/input-agent/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          OUT="dist/${{ matrix.artifact }}"
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/${{ matrix.binary }}"
          # 计算校验和，便于用户验证下载完整性
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 "$OUT/${{ matrix.binary }}" > "$OUT/SHA256SUMS.txt"
          else
            sha256sum "$OUT/${{ matrix.binary }}" > "$OUT/SHA256SUMS.txt"
          fi
          echo "--- 产物 ---"
          ls -lh "$OUT"
          cat "$OUT/SHA256SUMS.txt"

      - name: 冒烟测试（Linux：校验可执行 + 协议应答）
        if: matrix.linux
        shell: bash
        run: |
          set -uo pipefail
          BIN="dist/${{ matrix.artifact }}/${{ matrix.binary }}"
          # 1) ping 指令应返回 {"ok":true,"msg":"pong"}
          RESP=$(echo '{"action":"ping"}' | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "ping 应答: $RESP"
          if [ "$RESP" != '{"ok":true,"msg":"pong"}' ]; then
            echo "::error::ping 协议应答不符合预期"
            exit 1
          fi
          # 2) 非法 JSON 应返回 ok:false 且不崩溃
          RESP2=$(echo 'not-json' | timeout 10 "$BIN" 2>/dev/null | head -1 || true)
          echo "非法输入应答: $RESP2"
          case "$RESP2" in
            '{"ok":false'*) echo "非法输入被正确拒绝" ;;
            *) echo "::error::非法 JSON 处理异常"; exit 1 ;;
          esac
          # 3) 空行应被忽略，进程正常退出
          printf '\n\n' | timeout 10 "$BIN" >/dev/null 2>&1
          echo "空输入处理正常"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: input-agent-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error

  # 打 tag 时汇总所有平台产物并创建 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: 校验各平台产物齐全
        run: |
          set -euo pipefail
          for d in win32-x64 darwin-x64 darwin-arm64 linux-x64; do
            ls -lh "dist/input-agent-$d" || { echo "::error::缺少 $d 产物"; exit 1; }
          done
          find dist -type f | sort

      - name: 创建 Release 并上传分平台产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
          body: |
            ## RemoteType input-agent ${{ github.ref_name }}

            预编译的字符注入引擎（无需用户安装 Rust）。

            | 平台 | 目录 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `win32-x64/` | 需加入杀毒软件白名单 |
            | macOS Intel | `darwin-x64/` | 需开启「辅助功能」权限 |
            | macOS Apple Silicon | `darwin-arm64/` | 需开启「辅助功能」权限 |
            | Linux x64 | `linux-x64/` | **仅支持 X11，Wayland 不支持** |

            各目录内含 `SHA256SUMS.txt`，可用于校验下载完整性。
